name: Build native addons

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['rust/**', 'scripts/**', 'test/**', 'package.json', '.github/workflows/**']

jobs:
  # Fast gate: Rust unit tests + clippy + JS smoke/harness regression.
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clippy (no warnings)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - name: Rust unit tests
        run: cargo test
        working-directory: rust
      - name: Build native module
        run: npm run build:native
      - name: JS smoke tests
        run: node scripts/smoke.js
      - name: Clone RuoYi-Vue fixture
        run: git clone --depth 1 https://github.com/yangzongzhuan/RuoYi-Vue.git /tmp/RuoYi-Vue
      - name: RuoYi end-to-end harness
        run: node test/harness.js /tmp/RuoYi-Vue

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: spring-nav.linux-x64-gnu.node
            lib: libspring_nav.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: spring-nav.linux-arm64-gnu.node
            lib: libspring_nav.so
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: spring-nav.linux-x64-musl.node
            lib: libspring_nav.so
            musl: true
          - os: macos-13
            target: x86_64-apple-darwin
            name: spring-nav.darwin-x64.node
            lib: libspring_nav.dylib
          - os: macos-14
            target: aarch64-apple-darwin
            name: spring-nav.darwin-arm64.node
            lib: libspring_nav.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: spring-nav.win32-x64-msvc.node
            lib: spring_nav.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: spring-nav.win32-arm64-msvc.node
            lib: spring_nav.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross linker (aarch64 gnu)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd rust
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../native
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} ../native/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: native/${{ matrix.name }}

  # VSIX 是平台无关容器：native/index.js 运行时按 process.arch 选择 .node，
  # 一个 VSIX 打入全部 7 个架构的二进制，全平台通用。
  package:
    name: Package VSIX (all platforms)
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect native binaries from build matrix
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: native
      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
