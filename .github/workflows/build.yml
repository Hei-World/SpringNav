name: Build native addons

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: Rust unit tests + clippy + JS smoke/harness regression.
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clippy (no warnings)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - name: Rust unit tests
        run: cargo test
        working-directory: rust
      - name: Build native module
        run: npm run build:native
      - name: JS smoke tests
        run: node scripts/smoke.js
      - name: Clone RuoYi-Vue fixture
        run: git clone --depth 1 https://github.com/yangzongzhuan/RuoYi-Vue.git /tmp/RuoYi-Vue
      - name: RuoYi end-to-end harness
        run: node test/harness.js /tmp/RuoYi-Vue

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # PR 只跑测试门禁；多架构构建与打包仅在 tag / 手动触发时执行
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl 目标不支持 cdylib（musl libc 无动态加载），故无 linux musl 变体
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: spring-nav.linux-x64-gnu.node
            lib: libspring_nav.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: spring-nav.linux-arm64-gnu.node
            lib: libspring_nav.so
            cross: true
          # GitHub 已退役 Intel runner：arm64 host 上 SN_TARGET 交叉出 x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: spring-nav.darwin-arm64.node
            lib: libspring_nav.dylib
            extra_target: x86_64-apple-darwin
            extra_name: spring-nav.darwin-x64.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: spring-nav.win32-x64-msvc.node
            lib: spring_nav.dll
            extra_target: aarch64-pc-windows-msvc
            extra_name: spring-nav.win32-arm64-msvc.node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross target toolchain
        if: matrix.extra_target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_target }}
      - name: Cross linker (aarch64 gnu)
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd rust
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../native
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} ../native/${{ matrix.name }}
      - name: Build extra target (cross)
        if: matrix.extra_target
        shell: bash
        run: bash scripts/build-native.sh
        env:
          SN_TARGET: ${{ matrix.extra_target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: native/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: matrix.extra_target
        with:
          name: ${{ matrix.extra_name }}
          path: native/${{ matrix.extra_name }}

  # VSIX 是平台无关容器：native/index.js 运行时按 process.arch 选择 .node，
  # 一个 VSIX 打入全部 6 个架构的二进制，全平台通用。
  package:
    name: Package VSIX (all platforms)
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect native binaries from build matrix
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: native
      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    # 仓库 Workflow permissions 默认只读时，job 级显式声明才可靠生效
    permissions:
      contents: write
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
