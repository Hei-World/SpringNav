# SpringNav 全平台打包与发布
#
# 触发方式：
#   - push 到 master：全平台编译验证（不出安装包）
#   - push v* tag：全平台编译 + 打包 VSIX + 自动创建 GitHub Release
#   - Actions 页面手动触发（workflow_dispatch）：仅编译验证
#
# 产物矩阵（3 个云端 runner，共 5 个架构）：
#   ubuntu-latest  -> linux-x64-gnu
#   macos-latest   -> darwin-arm64（host） + darwin-x64（SN_TARGET 交叉）
#   windows-latest -> win32-x64-msvc（host） + win32-arm64-msvc（SN_TARGET 交叉）
#
# native/index.js 按 process.arch 运行时选择 .node，VSIX 内含全部架构。

name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            extra_target: ''
          - os: macos-latest
            name: darwin
            extra_target: x86_64-apple-darwin
          - os: windows-latest
            name: windows
            extra_target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build native (host)
        run: bash scripts/build-native.sh

      - name: Build native (cross target)
        if: matrix.extra_target != ''
        run: bash scripts/build-native.sh
        env:
          SN_TARGET: ${{ matrix.extra_target }}

      - run: npm ci

      - run: npm run compile

      - name: Run Rust tests
        if: matrix.name == 'linux-x64'
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.name }}
          path: '*.vsix'
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
