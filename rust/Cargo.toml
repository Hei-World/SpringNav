[package]
name = "spring-nav"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "spring_nav"
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "2"
regex = "1"
toml = "0.8"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
